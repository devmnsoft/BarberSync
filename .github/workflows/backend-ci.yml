name: Backend CI
on:
  push:
    paths:
      - 'Backend/**'
      - 'BarberSync.sln'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'Backend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore BarberSync.sln
      - run: dotnet build BarberSync.sln --configuration Debug --no-restore
      - run: dotnet build BarberSync.sln --configuration Release --no-restore
      # Automated .NET tests are intentionally deferred to the final testing phase.
      # The test sources remain versioned, but BarberSync.Tests is outside the main solution.
