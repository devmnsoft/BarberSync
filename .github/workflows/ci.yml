name: BarberSync 2.0 CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore BarberSync.sln
      - name: Build Debug
        run: dotnet build BarberSync.sln --configuration Debug --no-restore
      - name: Build Release
        run: dotnet build BarberSync.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test BarberSync.sln --configuration Release --no-build
      - name: Check JavaScript syntax
        run: find Web -type f -name '*.js' -print0 | xargs -0 -n1 node --check

  database-replay:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: barber
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d barber"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Replay canonical database script three times
        run: |
          for replay in 1 2 3; do
            echo "SQL replay ${replay}/3"
            psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d barber -f ScriptsSQL/script_completo.sql
          done
      - name: Verify canonical schema and seed data
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d barber <<'SQL'
          DO $$ BEGIN
            IF (SELECT count(*) FROM barber.schema_versions) <> 11 THEN RAISE EXCEPTION 'schema_versions inconsistente'; END IF;
            IF (SELECT count(*) FROM barber.permissions) = 0 THEN RAISE EXCEPTION 'permissions não provisionadas'; END IF;
            IF (SELECT count(*) FROM barber.roles) = 0 THEN RAISE EXCEPTION 'roles não provisionadas'; END IF;
          END $$;
          SELECT version, description FROM barber.schema_versions ORDER BY version;
          SELECT count(*) AS cash_registers FROM barber.cash_registers;
          SELECT count(*) AS service_orders FROM barber.service_orders;
          SQL

  mobile-totem:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [MobileApp, Totem]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            MobileApp/package-lock.json
            Totem/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Unit tests
        run: npm test --if-present -- --ci

  e2e:
    if: ${{ hashFiles('tests/e2e/package-lock.json') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install playwright
        run: |
          npm --prefix tests/e2e ci
          npx --prefix tests/e2e playwright install --with-deps chromium
      - name: Run E2E smoke
        run: npm --prefix tests/e2e test
