name: Production Readiness

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run the versioned production-readiness gate
        run: ./scripts/run-production-readiness.sh

      - name: Upload API log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-readiness-logs
          path: artifacts/production-readiness/
          if-no-files-found: ignore
