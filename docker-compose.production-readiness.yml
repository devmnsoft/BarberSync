services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: barber
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d barber"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /workspace
    volumes:
      - .:/workspace
      - production-readiness-nuget:/root/.nuget/packages
    environment:
      ASPNETCORE_ENVIRONMENT: ProductionReadiness
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=barber;Username=postgres;Password=postgres
      Cors__AllowedOrigins__0: http://localhost:5080
      Jwt__Issuer: BarberSync.Api
      Jwt__Audience: BarberSync.Clients
      Jwt__SigningKey: production-readiness-only-signing-key-32-characters-minimum
      BarberSync__DefaultTenantId: 11111111-1111-1111-1111-111111111111
      BarberSync__DefaultBranchId: 22222222-2222-2222-2222-222222222222
    command: ["dotnet", "run", "--project", "Backend/Presentation/BarberSync.Api/BarberSync.Api.csproj", "--configuration", "Release", "--no-build", "--urls", "http://0.0.0.0:5080"]
    ports:
      - "5080:5080"
    depends_on:
      postgres:
        condition: service_healthy

  node:
    image: node:20
    working_dir: /workspace
    volumes:
      - .:/workspace
    profiles: ["tools"]
    entrypoint: ["bash", "-lc"]

volumes:
  production-readiness-nuget:
